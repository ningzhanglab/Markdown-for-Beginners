name: Link check

# Once a week, check that the external links in the Markdown files still work.
# A broken link (404, or a site that no longer exists) fails the run, which
# makes GitHub notify the repository owner. Sites that refuse automated
# requests (403/429) are listed as warnings only.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python website/check_links.py
