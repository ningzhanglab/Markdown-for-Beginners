site_name: Markdown for Beginners
site_description: A practical Markdown starter kit for students, researchers, and first-time GitHub users.
site_url: https://ningzhanglab.github.io/Markdown-for-Beginners/
repo_url: https://github.com/ningzhanglab/Markdown-for-Beginners
repo_name: ningzhanglab/Markdown-for-Beginners
copyright: Copyright &copy; 2026 Ning Zhang &middot; Licensed under the <a href="https://github.com/ningzhanglab/Markdown-for-Beginners/blob/main/LICENSE">MIT License</a>

# _docs is generated by prepare.py from the .md files in the repository root folders.
# Edit those originals, never the files in _docs.
docs_dir: _docs
site_dir: _site
strict: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Start here:
      - Your first note: start-here/first-note.md
      - Practice editor: start-here/practice.md
      - Practice exercises: start-here/exercises.md
      - Why doesn't mine look right?: start-here/troubleshooting.md
      - Glossary: start-here/glossary.md
  - Cheat sheets:
      - Simple (start here): cheat-sheets/simple.md
      - Advanced: cheat-sheets/advanced.md
  - Handbooks:
      - Beginner handbook: handbooks/beginner-handbook.md
      - Setup and editors guide: handbooks/setup-and-editors.md
  - Templates: templates.md

markdown_extensions:
  - tables
  - footnotes
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 1
  - mdx_truly_sane_lists:
      nested_indent: 2
      truly_sane: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: false
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.keys

extra_javascript:
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js
  - assets/javascripts/math.js
extra_css:
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css
  - assets/stylesheets/extra.css
